name: Sync arena-picks to toolkit repo

on:
  push:
    branches: [main]
    paths: ['index.html']
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout are.na-picks
        uses: actions/checkout@v4

      - name: Checkout are.na-toolkit
        uses: actions/checkout@v4
        with:
          repository: mildlydiverting/are.na-toolkit
          token: ${{ secrets.TOOLKIT_SYNC_TOKEN }}
          path: are.na-toolkit

      - name: Copy index.html into toolkit docs, with a banner
        run: |
          {
            echo "<!-- AUTO-GENERATED — do not edit directly.";
            echo "     Source: https://github.com/mildlydiverting/are.na-picks/blob/main/index.html";
            echo "     Synced automatically by that repo's GitHub Action on every push to main. -->";
            cat index.html;
          } > are.na-toolkit/docs/arena-picks.html

      - name: Commit and push if changed
        run: |
          cd are.na-toolkit
          git config user.name "arena-picks-sync"
          git config user.email "actions@github.com"
          git add docs/arena-picks.html
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync arena-picks.html from are.na-picks@${GITHUB_SHA}"
            git push
          fi
